# Production stack for the VPS: web + Postgres + Caddy.
#
# Deploy: git pull                                            # Compose/Caddy files only
#         docker compose -f docker-compose.prod.yml pull
#         docker compose -f docker-compose.prod.yml run --rm migrate
#         docker compose -f docker-compose.prod.yml up -d
#
# `migrate` never starts on its own (profile "tools") — drizzle-kit migrate is
# an explicit deploy step, never something the web process does at start-up.
# It is a separately published image (ADR-003), not built on the VPS, and
# always deployed at the same IMAGE_TAG as `web` so the two never drift apart.
# See README "Deploying to the VPS" for the full procedure and rollback.

services:
  web:
    image: ghcr.io/vasilymarchenko/teachers:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-teachers}:${POSTGRES_PASSWORD:-teachers}@db:5432/${POSTGRES_DB:-teachers}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://${CADDY_DOMAIN}
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: ghcr.io/vasilymarchenko/teachers-migrator:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-teachers}:${POSTGRES_PASSWORD:-teachers}@db:5432/${POSTGRES_DB:-teachers}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teachers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teachers}
      POSTGRES_DB: ${POSTGRES_DB:-teachers}
    volumes:
      - teachers-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teachers} -d ${POSTGRES_DB:-teachers}"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - teachers-caddy-data:/data
      - teachers-caddy-config:/config
    depends_on:
      - web

volumes:
  teachers-pgdata:
  teachers-caddy-data:
  teachers-caddy-config:
