services:
  db:
    image: postgres:16-alpine
    container_name: teachers-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teachers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teachers}
      POSTGRES_DB: ${POSTGRES_DB:-teachers}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - teachers-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teachers} -d ${POSTGRES_DB:-teachers}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teachers-pgdata:
